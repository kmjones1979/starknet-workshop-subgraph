type MyEntity @entity {
    id: ID!
    jsonDescription: String!
}

type Transfer @entity {
    id: Bytes!
    from: Bytes!
    to: Bytes!
    value: BigInt!

    "The timestamp when the transfer was made"
    timestamp: String!

    "The block number of the transfer"
    blockNumber: BigInt!
}

type Approval @entity {
    id: Bytes!
    owner: Bytes!
    spender: Bytes!
    value: BigInt!

    "The timestamp when the approval was made"
    timestamp: String!

    "The block number of the approval"
    blockNumber: BigInt!
}
