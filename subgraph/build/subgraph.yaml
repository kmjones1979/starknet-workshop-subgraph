specVersion: 1.0.0
description: starknet Substreams-powered-Subgraph
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: substreams
    name: usdc-foundational-example
    network: starknet-mainnet
    source:
      package:
        moduleName: filter_transactions
        file: usdc-foundational-example/starknet-v0.1.0.spkg
    mapping:
      apiVersion: 0.0.7
      kind: substreams/graph-entities
      file: usdc-foundational-example/usdc-foundational-example.wasm
      handler: handleTriggers
