specVersion: 1.0.0
description: starknet Substreams-powered-Subgraph
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: substreams
    name: starknet
    network: starknet-mainnet
    source:
      package:
        moduleName: filter_transactions
        file: ../starknet-v0.1.0.spkg
    mapping:
      apiVersion: 0.0.7
      kind: substreams/graph-entities
      file: ./src/mappings.ts
      handler: handleTriggers